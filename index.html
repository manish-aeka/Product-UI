<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AnvIQ Labs builds AI-powered software products that help businesses make smarter decisions through Artificial Intelligence and Data Science.">
  <meta name="keywords" content="AI, Artificial Intelligence, Data Science, Machine Learning, Business Intelligence, AnvIQ Labs">
  <meta property="og:title" content="AnvIQ Labs — AI & Data Science Solutions">
  <meta property="og:description" content="Transforming Business Data Into Intelligent Digital Solutions.">
  <meta property="og:type" content="website">
  <title>AnvIQ Labs — AI & Data Science Solutions</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            indigo: { 500: '#6366f1', 600: '#4f46e5' },
            violet: { 500: '#8b5cf6', 600: '#7c3aed' },
            cyan:   { 500: '#06b6d4', 600: '#0891b2' },
          },
          fontFamily: {
            heading: ['Outfit', 'sans-serif'],
            body:    ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="./css/styles.css">
  <link rel="stylesheet" href="./css/animations.css">

  <!-- Preconnect fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>

  <!-- Loading Screen -->
  <div id="loading-screen" role="status" aria-label="Loading">
    <div class="loading-logo">AnvIQ Labs</div>
    <div class="loading-bar"><div class="loading-bar-inner"></div></div>
  </div>

  <!-- Toast notification -->
  <div id="toast" role="alert" aria-live="polite"></div>

  <!-- Navbar -->
  <header id="navbar" role="banner"></header>

  <!-- Mobile Menu -->
  <div id="mobile-menu-placeholder"></div>

  <!-- HERO -->
  <section id="hero-section" class="hero-section" aria-label="Hero"></section>

  <!-- Divider -->
  <div class="gradient-divider"></div>

  <!-- STATS -->
  <section id="stats-section" class="section section-sm" aria-label="Statistics"></section>

  <!-- Divider -->
  <div class="gradient-divider"></div>

  <!-- ABOUT -->
  <section id="about-section" class="section" aria-label="About AnvIQ Labs"></section>

  <!-- Divider -->
  <div class="gradient-divider"></div>

  <!-- SERVICES -->
  <section id="services-section" class="section" aria-label="Services"></section>

  <!-- Divider -->
  <div class="gradient-divider"></div>

  <!-- INDUSTRIES -->
  <section id="industries-section" class="section" aria-label="Industries We Serve"></section>

  <!-- Divider -->
  <div class="gradient-divider"></div>

  <!-- FEATURES -->
  <section id="features-section" class="section" aria-label="Why AnvIQ Labs"></section>

  <!-- Divider -->
  <div class="gradient-divider"></div>

  <!-- TESTIMONIALS -->
  <section id="testimonials-section" class="section" aria-label="Client Testimonials"></section>

  <!-- Divider -->
  <div class="gradient-divider"></div>

  <!-- CTA -->
  <section id="cta-section" class="cta-section section" aria-label="Call to Action"></section>

  <!-- Divider -->
  <div class="gradient-divider"></div>

  <!-- FOOTER -->
  <footer id="footer" role="contentinfo"></footer>

  <!-- Main JS Module -->
  <script type="module" src="./js/main.js"></script>
</body>
</html>
